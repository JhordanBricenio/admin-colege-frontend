<div class="content-body">
    <div class="container-fluid">
        <ng-container *ngIf="students.length > 0">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="page-title flex-wrap">
                                <div class="input-group search-area mb-md-0 mb-3">
                                    <input type="text" class="form-control" placeholder="Buscar por DNI..."
                                        (keyup)="searchStudentByDni($event.target.value)">
                                    <span class="input-group-text"><a href="javascript:void(0)">
                                            <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                                    fill="#01A3FF" />
                                            </svg>
                                        </a></span>
                                </div>
                            </div>
                        </div>
                        <!--column-->
                        <div class="col-xl-12 wow fadeInUp" data-wow-delay="1.5s">
                            <div class="table-responsive full-data">
                                <table
                                    class="table-responsive-lg table display dataTablesCard student-tab dataTable no-footer">
                                    <thead>
                                        <tr>
                                            <th>
                                                <input type="checkbox" class="form-check-input" id="checkAll"
                                                    required="">
                                            </th>
                                            <th>Nombres</th>
                                            <th>Apellidos</th>
                                            <th>DNI</th>
                                            <th>Email</th>
                                            <th>Grado</th>
                                            <th>Estado</th>
                                            <th class="text-end">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let student of students">
                                            <td>
                                                <div class="checkbox me-0 align-self-center">
                                                    <div class="custom-control custom-checkbox ">
                                                        <input type="checkbox" class="form-check-input" id="check8"
                                                            required="">
                                                        <label class="custom-control-label" for="check8"></label>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="trans-list">
                                                    <img src="assets/images/trans/1.jpg" alt=""
                                                        class="avatar avatar-sm me-3">
                                                    <h4>{{student.user.name}}</h4>
                                                </div>
                                            </td>
                                            <td>
                                                <div class="date">{{student.user.lastname}}</div>
                                            </td>
                                            <td><span class="text-primary font-w600">{{student.user.dni}}</span></td>
                                            <td>
                                                <h6 class="mb-0">{{student.user.email}}</h6>
                                            </td>
                                            <td>
                                                <div class="badge bg-info">
                                                    {{student.degree?.course || 'N/A'}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="badge bg-success">
                                                    {{student.status? 'Activo' : 'Inactivo'}}
                                                </div>
                                            </td>
                                            <td>
                                                <div class="action-icons d-flex justify-content-end gap-2">
                                                    <button class="btn btn-sm btn-primary" title="Ver pagos"
                                                        (click)="viewStudentPayments(student.idStudent, student.user.name + ' ' + student.user.lastname)">
                                                        <i class="material-icons">payment</i>
                                                    </button>
                                                    <button class="btn btn-sm btn-secondary" title="Imprimir contrato"
                                                        (click)="printStudentContract(student)">
                                                        <i class="fa fa-print"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!--column-->
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-12">
                    <app-paginator [pagination]="pagination" [routeName]="'payment/index'"></app-paginator>
                </div>
            </div>
        </ng-container>
        <ng-container *ngIf="students.length === 0">
            <div class="row">
                <div class="col-xl-12">
                    <div class="alert alert-info text-center" role="alert">
                        <h4>No hay estudiantes disponibles</h4>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</div>
