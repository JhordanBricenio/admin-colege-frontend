<div class="nav-header">
  <a *ngIf="settings.length > 0" href="" class="brand-logo d-flex align-items-center">
    <img *ngIf="settings[0].logo" [src]="settings[0].logo" alt="Logo" class="img-fluid rounded me-2"
      style="max-height: 44px;">
    <div *ngIf="!settings[0].logo" class="text-muted me-2">Sin logo</div>
    <span *ngIf="settings[0]?.name" class="fw-semibold">{{ settings[0].name }}</span>
  </a>
  <div class="nav-control">
    <div class="hamburger">
      <span class="line"></span><span class="line"></span><span class="line"></span>
    </div>
  </div>
</div>

<div class="header">
  <div class="header-content">
    <nav class="navbar navbar-expand">
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav header-right align-items-center">
          <li class="nav-item">
            <a class="nav-link bell dz-theme-mode" href="javascript:void(0);" title="Cambiar tema">
              <i class="far fa-moon"></i>
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link bell dz-fullscreen" href="javascript:void(0);" title="Pantalla completa">
              <i class="fas fa-expand"></i>
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link d-flex align-items-center gap-2" href="javascript:void(0);" data-bs-toggle="dropdown"
              aria-expanded="false">
              <span class="session-avatar">{{ currentUserInitials }}</span>
              <div class="d-none d-md-block text-start">
                <div class="session-name">{{ currentUserName }}</div>
                <small class="session-role">{{ currentUserRole }}</small>
              </div>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <div class="px-3 py-2 border-bottom">
                <div class="fw-semibold">{{ currentUserName }}</div>
                <small class="text-muted">{{ currentUserRole }}</small>
              </div>
              <a class="dropdown-item" href="/admin">Inicio</a>
              <a class="dropdown-item text-danger" href="/logout">Cerrar sesión</a>
            </div>
          </li>
        </ul>
      </div>
    </nav>
  </div>
</div>
