<div class="content-body">
  <div class="container-fluid">
    <div class="row">
      <div class="col-xl-12">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Detalles del estudiante</h5>
          </div>
          <form [formGroup]="form" (ngSubmit)="buscar()">
            <div class="card-body">
              <div class="row">
                <div class="col-xl-3 col-lg-4">
                  <label class="form-label text-primary">Imagen<span class="required">*</span></label>
                  <div class="avatar-upload">
                    <div class="avatar-preview">
                      <div id="imagePreview" style="background-image: url(assets/images/avatar/4.jpg);">
                      </div>
                    </div>
                    <div class="change-btn mt-2 mb-lg-0 mb-3">
                      <input type='file' class="form-control d-none" id="imageUpload" accept=".png, .jpg, .jpeg">
                      <label for="imageUpload" class="dlab-upload mb-0 btn btn-primary btn-sm">Cargar imagen</label>
                      <a href="javascript:void" class="btn btn-danger light remove-img ms-2 btn-sm">Eliminar</a>
                    </div>
                  </div>
                </div>
                <div class="col-xl-9 col-lg-8">
                  <div class="row">
                    <div class="col-xl-6 col-sm-6">
                      <div class="mb-3">
                        <label for="dni" class="form-label text-primary">DNI<span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="dni" id="dni" placeholder="85412174">
                      </div>
                      <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label text-primary">Nombres<span
                            class="required">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" formControlName="nombres" placeholder="James" readonly>
                      </div>
                      <div class="mb-3">
                        <label class="form-label text-primary">Nacimiento<span
                            class="required">*</span></label>
                        <div class="d-flex">
                          <input type="date" class="form-control" placeholder="2017-06-04" id="datepicker">
                        </div>
                      </div>
                      <div class="mb-3">
                        <label class="form-label text-primary">Sexo<span class="required">*</span></label>
                        <div class="form-check ">
                          <input class="form-check-input" type="radio" name="sexo" id="inlineRadio1" value="option1">
                          <label class="form-check-label" for="inlineRadio1">Masculino</label>
                        </div>
                        <div class="form-check ">
                          <input class="form-check-input" type="radio" name="sexo" id="inlineRadio2" value="option2">
                          <label class="form-check-label" for="inlineRadio2">Femenino</label>
                        </div>
                        <div class="form-check ">
                          <input class="form-check-input" type="radio" name="sexo" id="inlineRadio3" value="option3">
                          <label class="form-check-label" for="inlineRadio3">Otro</label>
                        </div>
                      </div>
                      <div class="mb-3">
                        <label for="exampleFormControlInput3" class="form-label text-primary">Correo electrónico<span
                            class="required">*</span></label>
                        <input type="email" class="form-control" id="exampleFormControlInput3"
                          placeholder="hello@example.com">
                      </div>
                      <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label text-primary">Dirección<span
                            class="required">*</span></label>
                        <textarea class="form-control" id="exampleFormControlTextarea1" rows="6">
                      </textarea>
                      </div>
                      <!--Sexo checkbok-->
                      
                    </div>
                    <div class="col-xl-6 col-sm-6">
                      <div class="mb-3">
                        <label for="exampleFormControlInput4" class="form-label text-primary">Apellido paterno<span
                            class="required">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" formControlName="apellidoPaterno" placeholder="Wally" readonly>
                      </div>
                      <div class="mb-3">
                        <label for="exampleFormControlInput5" class="form-label text-primary">Apellido materno<span
                            class="required">*</span></label>
                        <input type="text" class="form-control" id="exampleFormControlInput1" formControlName="apellidoMaterno" readonly
                          placeholder="Mana William">
                      </div>
                      <div class="mb-3">
                        <label for="exampleFormControlInput6" class="form-label text-primary">Celular<span
                            class="required">*</span></label>
                        <input type="number" class="form-control" id="exampleFormControlInput6"
                          placeholder="+123456789">
                      </div>
                    </div>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary mt-2 d-none">Buscar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col-xl-12">
      <div class="card">
        <div class="card-header">
          <h5 class="mb-0">Detalles del tutor</h5>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-xl-6 col-sm-6">
              <div class="mb-3">
                        <label for="dni" class="form-label text-primary">DNI<span class="required">*</span></label>
                        <input type="text" class="form-control" formControlName="dni" id="dni" placeholder="85412174">
                      </div>
              <div class="mb-3">
                <label for="exampleFormControlInput8" class="form-label text-primary">Nombres<span
                    class="required">*</span></label>
                <input type="text" class="form-control" id="exampleFormControlInput8" placeholder="Mana">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput9" class="form-label text-primary">Correo electrónico<span
                    class="required">*</span></label>
                <input type="email" class="form-control" id="exampleFormControlInput9" placeholder="hello@example.com">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlTextarea2" class="form-label text-primary">Dirección<span
                    class="required">*</span></label>
                <textarea class="form-control" id="exampleFormControlTextarea2" rows="6">

                </textarea>
              </div>
            </div>

            <div class="col-xl-6 col-sm-6">
              <div class="mb-3">
                <label for="exampleFormControlInput10" class="form-label text-primary">Apellidos<span
                    class="required">*</span></label>
                <input type="text" class="form-control" id="exampleFormControlInput10" placeholder="Wick">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput11" class="form-label text-primary">Celular<span
                    class="required">*</span></label>
                <input type="number" class="form-control" id="exampleFormControlInput11" placeholder="+123456789">
              </div>
            </div>
          </div>
          <div class="">
            <button class="btn btn-outline-primary me-3">Guardar como borrador</button>
            <button class="btn btn-primary" type="button">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
