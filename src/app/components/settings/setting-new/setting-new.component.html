<div class="content-body">
	<div class="container-fluid">
		<div class="card">
			<div class="card-header d-flex justify-content-between align-items-center">
				<h5 class="card-title mb-0">{{ isEditMode ? 'Editar configuración' : 'Nueva configuración' }}</h5>
			</div>
			<div class="card-body">
				<form [formGroup]="form" (ngSubmit)="submit()">
					<div class="row">
						<div class="col-md-8">
							<div class="mb-3">
								<label class="form-label text-primary">Nombre de la institución <span class="required">*</span></label>
								<input class="form-control" formControlName="name" placeholder="Colegio San Martín" />
								<small class="text-danger" *ngIf="form.get('name')?.touched && form.get('name')?.invalid">Nombre requerido (mín. 3 caracteres)</small>
							</div>
							<div class="mb-3">
								<label class="form-label text-primary">Email <span class="required">*</span></label>
								<input class="form-control" formControlName="email" type="email" placeholder="colegio@dominio.com" />
								<small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Email válido requerido</small>
							</div>
							<div class="mb-3">
								<label class="form-label text-primary">Teléfono <span class="required">*</span></label>
								<input class="form-control" formControlName="phone" placeholder="+51 999 888 777" />
								<small class="text-danger" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">Teléfono requerido</small>
							</div>
							<div class="mb-3">
								<label class="form-label text-primary">Dirección <span class="required">*</span></label>
								<input class="form-control" formControlName="address" placeholder="Av. Siempre Viva 123" />
								<small class="text-danger" *ngIf="form.get('address')?.touched && form.get('address')?.invalid">Dirección requerida</small>
							</div>
							<div class="mb-3">
								<label class="form-label text-primary">Logo (URL)</label>
								<input class="form-control" formControlName="logo" placeholder="https://.../logo.png" />
							</div>
						</div>
						<div class="col-md-4">
							<div class="text-center">
								<div class="text-muted small mb-2">Previsualización de logo</div>
								<img *ngIf="form.get('logo')?.value; else noLogo" [src]="form.get('logo')?.value" class="img-fluid rounded border" style="max-height: 160px;" alt="Logo" />
								<ng-template #noLogo>
									<div class="border rounded d-flex align-items-center justify-content-center" style="height:160px;">
										<span class="text-muted">Sin logo</span>
									</div>
								</ng-template>
							</div>
						</div>
					</div>

					<div class="mt-3">
						<button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading">
							{{ isEditMode ? 'Actualizar' : 'Guardar' }}
						</button>
						<button type="button" class="btn btn-secondary ms-2" (click)="cancel()">Cancelar</button>
					</div>
				</form>
			</div>
		</div>
	</div>
  
</div>
