<div class="content-body">
    <div class="container-fluid">
        <ng-container *ngIf="managements.length > 0">
            <div class="row">
                <div class="col-xl-12">
                    <div class="row">
                        <div class="col-xl-12">
                            <div class="page-title flex-wrap">
                                <div class="input-group search-area mb-md-0 mb-3">
                                    <input type="text" class="form-control" placeholder="Buscar aquí...">
                                    <span class="input-group-text"><a href="javascript:void(0)">
                                            <svg width="15" height="15" viewBox="0 0 18 18" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M17.5605 15.4395L13.7527 11.6317C14.5395 10.446 15 9.02625 15 7.5C15 3.3645 11.6355 0 7.5 0C3.3645 0 0 3.3645 0 7.5C0 11.6355 3.3645 15 7.5 15C9.02625 15 10.446 14.5395 11.6317 13.7527L15.4395 17.5605C16.0245 18.1462 16.9755 18.1462 17.5605 17.5605C18.1462 16.9747 18.1462 16.0252 17.5605 15.4395V15.4395ZM2.25 7.5C2.25 4.605 4.605 2.25 7.5 2.25C10.395 2.25 12.75 4.605 12.75 7.5C12.75 10.395 10.395 12.75 7.5 12.75C4.605 12.75 2.25 10.395 2.25 7.5V7.5Z"
                                                    fill="#01A3FF" />
                                            </svg>
                                        </a></span>
                                </div>
                                <div>
                                    <a [routerLink]="['/admin/managements/new']" class="btn btn-primary">
                                        + Nueva Gestión
                                    </a>
                                </div>
                            </div>
                        </div>
                        <!--column-->
                        <div class="col-xl-12 wow fadeInUp" data-wow-delay="1.5s">
                            <div class="table-responsive full-data">
                                <table
                                    class="table-responsive-lg table display dataTablesCard student-tab dataTable no-footer">
                                    <thead>
                                        <tr>
                                            <th>Nombre</th>
                                            <th>Estado</th>
                                            <th>Fecha y hora de registro</th>
                                            <th class="text-end">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody>

                                        <tr *ngFor="let item of managements">
                                            <td><span class="text-primary font-w600">{{item.name}}</span></td>
                                            <td>
                                                <div class="form-check form-switch">
                                                    <input class="form-check-input" type="checkbox" role="switch"
                                                        id="switchCheckDefault" [checked]="item.status">
                                                </div>
                                            </td>
                                            <td>
                                                <h6 class="mb-0">{{item.createdAt | date: 'short'}}</h6>

                                            </td>
                                            <td>
                                                <div class="d-flex justify-content-end gap-2">
                                                    <a [routerLink]="['/admin/managements/edit', item.idManagement]"
                                                        class="btn btn-primary shadow btn-xs sharp me-1" title="Editar">
                                                        <i class="fas fa-pencil-alt"></i>
                                                    </a>
                                                    <button (click)="deleteManagement(item.idManagement)"
                                                        class="btn btn-danger shadow btn-xs sharp me-1"
                                                        title="Eliminar">
                                                        <i class="fa fa-trash"></i>
                                                    </button>
                                                    <button class="btn btn-warning shadow btn-xs sharp"
                                                        title="Bloquear">
                                                        <i class="fa fa-ban"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
        <ng-container *ngIf="managements.length === 0">
            <div class="alert alert-info alert-dismissible fade show">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" class="me-2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
                <strong>Info!</strong> No hay gestión disponibles.
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="btn-close"><span><i
                            class="fa-solid fa-xmark"></i></span>
                </button>
            </div>
            <div class="d-flex justify-content-end">
                <a [routerLink]="['/admin/managements/new']" class="btn btn-primary">
                    + Nueva Gestión
                </a>
            </div>
        </ng-container>
    </div>
</div>
